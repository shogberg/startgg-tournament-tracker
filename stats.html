<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secret Labs Stats</title>
  <style>
    :root {
      --bg:          #0d0d14;
      --surface:     #16161f;
      --surface2:    #1e1e2a;
      --border:      #2a2a3a;
      --accent:      #ff6b2b;
      --accent-soft: #ff8c55;
      --text:        #e8e8f0;
      --muted:       #7a7a90;
      --win:         #4ade80;
      --loss:        #f87171;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 15px;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 2px solid var(--accent);
      padding: 0 2rem;
      display: flex;
      align-items: stretch;
      gap: 2rem;
    }
    .header-title {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      padding: 1.1rem 0;
      white-space: nowrap;
    }
    .header-title .brand  { color: var(--accent); }
    .header-title .suffix { color: var(--text); }

    /* ── Nav tabs ── */
    nav {
      display: flex;
      align-items: stretch;
      gap: 0;
    }
    .nav-tab {
      display: flex;
      align-items: center;
      padding: 0 1.25rem;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: color 0.15s, border-color 0.15s;
      user-select: none;
    }
    .nav-tab:hover { color: var(--text); }
    .nav-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* ── Pages ── */
    .page { display: none; }
    .page.active { display: block; }

    /* ── Layout ── */
    main { max-width: 1080px; margin: 0 auto; padding: 2rem 1.5rem; }

    .section { margin-bottom: 2.5rem; }

    .section-label {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.85rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }

    /* ── Autocomplete ── */
    .ac-wrap { position: relative; }

    input[type="text"] {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.7rem 1rem;
      font-size: 0.95rem;
      border-radius: 6px;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="text"]:focus { border-color: var(--accent); }
    input[type="text"]::placeholder { color: var(--muted); }

    .ac-list {
      position: absolute;
      top: calc(100% + 2px);
      left: 0; right: 0;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      max-height: 240px;
      overflow-y: auto;
      z-index: 200;
      display: none;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .ac-list.open { display: block; }
    .ac-item {
      padding: 0.55rem 1rem;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.1s;
    }
    .ac-item:hover, .ac-item.hi { background: var(--border); color: var(--accent-soft); }

    /* ── Buttons ── */
    .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.7rem 1.4rem;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
      white-space: nowrap;
    }
    .btn:hover:not(:disabled) { background: var(--accent-soft); }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }

    /* ── Player lookup row ── */
    .lookup-row { display: flex; gap: 0.75rem; align-items: stretch; }
    .lookup-row .ac-wrap { flex: 1; }

    /* ── Stat cards ── */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 0.85rem;
      margin-bottom: 1.5rem;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.1rem 1.25rem;
    }
    .stat-card .lbl {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }
    .stat-card .val {
      font-size: 2rem;
      font-weight: 800;
      color: var(--accent);
      line-height: 1;
    }
    .stat-card .sub {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.3rem;
    }

    /* ── Tables ── */
    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    thead { background: var(--surface2); }
    th {
      text-align: left;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 0.6rem 1rem;
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 0.65rem 1rem;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: var(--surface2); }

    /* ── Placement badges ── */
    .badge {
      display: inline-block;
      padding: 0.15rem 0.55rem;
      border-radius: 4px;
      font-weight: 700;
      font-size: 0.82rem;
    }
    .b1 { background: #ffd700; color: #000; }
    .b2 { background: #c0c0c0; color: #000; }
    .b3 { background: #cd7f32; color: #fff; }
    .b4 { background: #333345; color: var(--text); }
    .bx { background: #222230; color: var(--muted); }

    /* ── Win / Loss text ── */
    .win  { color: var(--win);  font-weight: 700; }
    .loss { color: var(--loss); font-weight: 700; }

    /* ── H2H search row ── */
    .h2h-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr auto;
      gap: 0.75rem;
      align-items: end;
    }
    .h2h-fl { display: flex; flex-direction: column; gap: 0.3rem; }
    .h2h-fl .lbl {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .vs-sep {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--muted);
      padding-bottom: 0.7rem;
    }

    /* ── H2H summary banner ── */
    .h2h-banner {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.4rem 2rem;
      margin-bottom: 1.25rem;
      gap: 1.5rem;
    }
    .h2h-side { text-align: center; }
    .h2h-side .name {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
      color: var(--text);
    }
    .h2h-side .big {
      font-size: 2.8rem;
      font-weight: 900;
      line-height: 1;
    }
    .h2h-side .meta {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.35rem;
    }
    .big.leader  { color: var(--win); }
    .big.trailer { color: var(--loss); }
    .big.tied    { color: var(--accent); }
    .h2h-center  { text-align: center; font-size: 1.3rem; font-weight: 800; color: var(--muted); }

    /* ── Tournament group ── */
    .t-group {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 0.85rem;
      overflow: hidden;
    }
    .t-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.8rem 1.1rem;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      gap: 1rem;
    }
    .t-header .t-name { font-weight: 700; font-size: 0.92rem; }
    .t-header .t-uuid { font-size: 0.68rem; color: var(--muted); font-family: monospace; }

    /* ── Player name + id header ── */
    .player-header { margin-bottom: 1.25rem; }
    .player-header .gamer { font-size: 1.5rem; font-weight: 800; }
    .player-header .pid   { font-size: 0.72rem; color: var(--muted); font-family: monospace; margin-top: 0.2rem; }

    /* ── Utility ── */
    .hidden { display: none !important; }
    .msg { text-align: center; color: var(--muted); padding: 2rem; font-size: 0.9rem; }

    @media (max-width: 580px) {
      header { gap: 1rem; padding: 0 1rem; }
      .h2h-row { grid-template-columns: 1fr 1fr; }
      .vs-sep { display: none; }
      .btn-h2h { grid-column: 1 / -1; }
      .h2h-banner { grid-template-columns: 1fr auto 1fr; padding: 1rem; gap: 0.75rem; }
      .h2h-side .big { font-size: 2rem; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-title">
    <span class="brand">Secret Labs</span><span class="suffix">&nbsp;· Stats</span>
  </div>
  <nav>
    <div class="nav-tab active" data-page="page-player">Player Lookup</div>
    <div class="nav-tab"        data-page="page-h2h">Head to Head</div>
    <div class="nav-tab"        data-page="page-leaderboard">Points Leaderboard</div>
    <div class="nav-tab"        data-page="page-giants">Giant Slayers</div>
  </nav>
</header>

<main>

  <!-- ── Page: Player Lookup ── -->
  <div class="page active" id="page-player">
    <div class="section">
      <div class="lookup-row">
        <div class="ac-wrap">
          <input id="ps-input" type="text" placeholder="Search gamertag…" autocomplete="off">
          <div class="ac-list" id="ps-list"></div>
        </div>
        <button class="btn" id="ps-btn" disabled>View Stats</button>
      </div>

      <div id="player-section" class="hidden" style="margin-top:1.5rem;">
        <div class="player-header">
          <div class="gamer" id="ps-name"></div>
          <div class="pid"   id="ps-pid"></div>
        </div>
        <div class="stat-grid" id="ps-cards"></div>
        <div class="section-label" style="margin-top:1.25rem;">Top 8 Appearances</div>
        <div id="ps-top8"></div>
      </div>
    </div>
  </div>

  <!-- ── Page: Points Leaderboard ── -->
  <div class="page" id="page-leaderboard">
    <div class="section">
      <div id="leaderboard-wrap">
        <div class="msg">Loading…</div>
      </div>
    </div>
  </div>

  <!-- ── Page: Giant Slayers ── -->
  <div class="page" id="page-giants">
    <div class="section">
      <div id="giants-wrap">
        <div class="msg">Loading…</div>
      </div>
    </div>
  </div>

  <!-- ── Page: Head to Head ── -->
  <div class="page" id="page-h2h">
    <div class="section">
      <div class="h2h-row">
        <div class="h2h-fl">
          <div class="lbl">Player 1</div>
          <div class="ac-wrap">
            <input id="h1-input" type="text" placeholder="Search gamertag…" autocomplete="off">
            <div class="ac-list" id="h1-list"></div>
          </div>
        </div>
        <div class="vs-sep">VS</div>
        <div class="h2h-fl">
          <div class="lbl">Player 2</div>
          <div class="ac-wrap">
            <input id="h2-input" type="text" placeholder="Search gamertag…" autocomplete="off">
            <div class="ac-list" id="h2-list"></div>
          </div>
        </div>
        <button class="btn btn-h2h" id="h2h-btn" disabled>Compare</button>
      </div>
      <div id="h2h-section" class="hidden" style="margin-top:1.5rem;"></div>
    </div>
  </div>

</main>

<script>
  /* ================================================================
     State
  ================================================================ */
  let allPlayers = [];
  const sel = { ps: null, h1: null, h2: null };

  /* ================================================================
     Tab navigation
  ================================================================ */
  let leaderboardLoaded = false;
  let giantsLoaded      = false;

  document.querySelectorAll('.nav-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById(tab.dataset.page).classList.add('active');
      if (tab.dataset.page === 'page-leaderboard' && !leaderboardLoaded) loadLeaderboard();
      if (tab.dataset.page === 'page-giants'      && !giantsLoaded)      loadGiantSlayers();
    });
  });

  /* ================================================================
     Bootstrap
  ================================================================ */
  async function boot() {
    const res = await fetch('/api/players');
    allPlayers = await res.json();
  }

  /* ================================================================
     Autocomplete
  ================================================================ */
  function makeAC(inputId, listId, key, onPick) {
    const input = document.getElementById(inputId);
    const list  = document.getElementById(listId);
    let hi = -1;

    function filter(q) {
      q = q.toLowerCase().trim();
      if (!q) return [];
      return allPlayers
        .filter(p => p.gamertag.toLowerCase().includes(q) ||
                     (p.display_name||'').toLowerCase().includes(q))
        .slice(0, 25);
    }

    function render(matches) {
      if (!matches.length) { list.classList.remove('open'); return; }
      hi = -1;
      list.innerHTML = matches.map((p, i) =>
        `<div class="ac-item" data-i="${i}" data-id="${p.player_id}" data-tag="${esc(p.gamertag)}">${esc(p.gamertag)}</div>`
      ).join('');
      list.querySelectorAll('.ac-item').forEach(el => {
        el.addEventListener('mousedown', e => {
          e.preventDefault();
          pick(el.dataset.id, el.dataset.tag);
        });
      });
      list.classList.add('open');
    }

    function pick(id, tag) {
      sel[key] = id;
      input.value = tag;
      list.classList.remove('open');
      onPick();
    }

    input.addEventListener('input', () => {
      sel[key] = null;
      onPick();
      render(filter(input.value));
    });

    input.addEventListener('keydown', e => {
      const items = list.querySelectorAll('.ac-item');
      if (e.key === 'ArrowDown') {
        hi = Math.min(hi + 1, items.length - 1);
        items.forEach((el, i) => el.classList.toggle('hi', i === hi));
        e.preventDefault();
      } else if (e.key === 'ArrowUp') {
        hi = Math.max(hi - 1, 0);
        items.forEach((el, i) => el.classList.toggle('hi', i === hi));
        e.preventDefault();
      } else if (e.key === 'Enter' && hi >= 0) {
        const el = items[hi];
        pick(el.dataset.id, el.dataset.tag);
      } else if (e.key === 'Escape') {
        list.classList.remove('open');
      }
    });

    document.addEventListener('click', e => {
      if (!input.contains(e.target) && !list.contains(e.target))
        list.classList.remove('open');
    });
  }

  /* ================================================================
     Player Stats
  ================================================================ */
  makeAC('ps-input', 'ps-list', 'ps', () => {
    document.getElementById('ps-btn').disabled = !sel.ps;
  });

  document.getElementById('ps-btn').addEventListener('click', loadPlayerStats);

  async function loadPlayerStats() {
    if (!sel.ps) return;
    const p = allPlayers.find(x => x.player_id === sel.ps);
    const res  = await fetch(`/api/player/${encodeURIComponent(sel.ps)}/stats`);
    const data = await res.json();

    document.getElementById('ps-name').textContent = p?.gamertag || sel.ps;
    document.getElementById('ps-pid').textContent  = `ID: ${sel.ps}`;

    document.getElementById('ps-cards').innerHTML = `
      <div class="stat-card">
        <div class="lbl">Points</div>
        <div class="val">${data.points}</div>
      </div>
      <div class="stat-card">
        <div class="lbl">Best Placement</div>
        <div class="val">${data.best_placement != null ? '#' + data.best_placement : '—'}</div>
      </div>
      <div class="stat-card">
        <div class="lbl">Top 8 Appearances</div>
        <div class="val">${data.top8.length}</div>
      </div>
      <div class="stat-card">
        <div class="lbl">Match Win %</div>
        <div class="val">${pct(data.match_wins, data.match_wins + data.match_losses)}</div>
        <div class="sub">${data.match_wins}W &ndash; ${data.match_losses}L</div>
      </div>
      <div class="stat-card">
        <div class="lbl">Set Win %</div>
        <div class="val">${pct(data.set_wins, data.set_wins + data.set_losses)}</div>
        <div class="sub">${data.set_wins}W &ndash; ${data.set_losses}L</div>
      </div>
      <div class="stat-card">
        <div class="lbl">Top 6 Match Win %</div>
        <div class="val">${pct(data.top6_wins, data.top6_wins + data.top6_losses)}</div>
        <div class="sub">${data.top6_wins}W &ndash; ${data.top6_losses}L</div>
      </div>
      <div class="stat-card">
        <div class="lbl">Top 6 Set Win %</div>
        <div class="val">${pct(data.top6_set_wins, data.top6_set_wins + data.top6_set_losses)}</div>
        <div class="sub">${data.top6_set_wins}W &ndash; ${data.top6_set_losses}L</div>
      </div>
    `;

    const top8Wrap = document.getElementById('ps-top8');
    if (!data.top8.length) {
      top8Wrap.innerHTML = '<div class="msg">No top 8 finishes recorded yet.</div>';
    } else {
      top8Wrap.innerHTML = `
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th>Place</th><th>Tournament</th><th>Event</th>
            </tr></thead>
            <tbody>
              ${data.top8.map(r => `
                <tr>
                  <td>${badge(r.placement)}</td>
                  <td>${esc(r.title)}</td>
                  <td>${esc(r.event_name)}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    document.getElementById('player-section').classList.remove('hidden');
  }

  /* ================================================================
     Points Leaderboard
  ================================================================ */
  async function loadLeaderboard() {
    const wrap = document.getElementById('leaderboard-wrap');
    const res  = await fetch('/api/leaderboard');
    const rows = await res.json();
    leaderboardLoaded = true;

    if (!rows.length) {
      wrap.innerHTML = '<div class="msg">No points data yet.</div>';
      return;
    }

    wrap.innerHTML = `
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>Rank</th>
            <th>Player</th>
            <th>Points</th>
          </tr></thead>
          <tbody>
            ${rows.map((r, i) => `
              <tr>
                <td>${rankBadge(i + 1)}</td>
                <td>${esc(r.gamertag)}</td>
                <td style="font-weight:700;color:var(--accent)">${r.points}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
  }

  function rankBadge(n) {
    if (n === 1) return `<span class="badge b1">#1</span>`;
    if (n === 2) return `<span class="badge b2">#2</span>`;
    if (n === 3) return `<span class="badge b3">#3</span>`;
    return `<span style="color:var(--muted);font-weight:600">#${n}</span>`;
  }

  /* ================================================================
     Giant Slayers
  ================================================================ */
  async function loadGiantSlayers() {
    const wrap = document.getElementById('giants-wrap');
    const res    = await fetch('/api/giant-slayers');
    const groups = await res.json();
    giantsLoaded = true;

    if (!groups.length) {
      wrap.innerHTML = '<div class="msg">No giant-slaying results found yet.</div>';
      return;
    }

    const tBlocks = groups.map(g => {
      const rows = g.matches.map(m => `
        <tr>
          <td>${esc(m.round_name || '—')}</td>
          <td>${esc(m.identifier || '—')}</td>
          <td class="win">${esc(m.winner_gamertag)}</td>
          <td class="loss">${esc(m.loser_gamertag)}</td>
          <td class="win">${m.winner_player_score != null ? m.winner_player_score : '—'}</td>
          <td class="loss">${m.loser_player_score  != null ? m.loser_player_score  : '—'}</td>
        </tr>
      `).join('');

      return `
        <div class="t-group">
          <div class="t-header">
            <span class="t-name">${esc(g.tournament_title)}</span>
            <span class="t-uuid">${esc(g.tournament_uuid)}</span>
          </div>
          <table>
            <thead><tr>
              <th>Round</th>
              <th>Match ID</th>
              <th>Winner</th>
              <th>Giant</th>
              <th>Winner Score</th>
              <th>Giant Score</th>
            </tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `;
    }).join('');

    wrap.innerHTML = tBlocks;
  }

  /* ================================================================
     Head to Head
  ================================================================ */
  makeAC('h1-input', 'h1-list', 'h1', checkH2H);
  makeAC('h2-input', 'h2-list', 'h2', checkH2H);

  function checkH2H() {
    document.getElementById('h2h-btn').disabled = !(sel.h1 && sel.h2);
  }

  document.getElementById('h2h-btn').addEventListener('click', loadH2H);

  async function loadH2H() {
    if (!sel.h1 || !sel.h2) return;
    const p1 = allPlayers.find(x => x.player_id === sel.h1);
    const p2 = allPlayers.find(x => x.player_id === sel.h2);
    const n1  = p1?.gamertag || sel.h1;
    const n2  = p2?.gamertag || sel.h2;

    const res    = await fetch(`/api/h2h?player1=${encodeURIComponent(sel.h1)}&player2=${encodeURIComponent(sel.h2)}`);
    const groups = await res.json();
    const wrap   = document.getElementById('h2h-section');

    if (!groups.length) {
      wrap.innerHTML = '<div class="msg">No matches found between these two players.</div>';
      wrap.classList.remove('hidden');
      return;
    }

    // Aggregate totals
    let p1MW = 0, p2MW = 0, p1Sets = 0, p2Sets = 0;
    for (const g of groups) {
      for (const m of g.matches) {
        if (m.p1_match_win) p1MW++; else p2MW++;
        if (m.p1_score != null && m.p2_score != null) {
          p1Sets += m.p1_score;
          p2Sets += m.p2_score;
        }
      }
    }
    const totalM = p1MW + p2MW;
    const totalS = p1Sets + p2Sets;

    function leaderClass(a, b) {
      return a > b ? 'leader' : a < b ? 'trailer' : 'tied';
    }

    const banner = `
      <div class="h2h-banner">
        <div class="h2h-side">
          <div class="name">${esc(n1)}</div>
          <div class="big ${leaderClass(p1MW, p2MW)}">${p1MW}</div>
          <div class="meta">
            Match Win: ${pct(p1MW, totalM)}
            &nbsp;&middot;&nbsp;
            Sets Won: ${p1Sets} (${pct(p1Sets, totalS)})
          </div>
        </div>
        <div class="h2h-center">VS</div>
        <div class="h2h-side">
          <div class="name">${esc(n2)}</div>
          <div class="big ${leaderClass(p2MW, p1MW)}">${p2MW}</div>
          <div class="meta">
            Match Win: ${pct(p2MW, totalM)}
            &nbsp;&middot;&nbsp;
            Sets Won: ${p2Sets} (${pct(p2Sets, totalS)})
          </div>
        </div>
      </div>
    `;

    const tBlocks = groups.map(g => {
      const rows = g.matches.map(m => {
        const w = m.p1_match_win;
        return `
          <tr>
            <td>${esc(m.round_name || '—')}</td>
            <td>${esc(m.identifier || '—')}</td>
            <td class="${w ? 'win' : 'loss'}">${m.p1_score != null ? m.p1_score : '—'}</td>
            <td class="${!w ? 'win' : 'loss'}">${m.p2_score != null ? m.p2_score : '—'}</td>
            <td class="${w ? 'win' : 'loss'}">${w ? 'WIN' : 'LOSS'}</td>
          </tr>
        `;
      }).join('');

      return `
        <div class="t-group">
          <div class="t-header">
            <span class="t-name">${esc(g.tournament_title)}</span>
            <span class="t-uuid">${esc(g.tournament_uuid)}</span>
          </div>
          <table>
            <thead><tr>
              <th>Round</th>
              <th>Match ID</th>
              <th>${esc(n1)}</th>
              <th>${esc(n2)}</th>
              <th>${esc(n1)} Result</th>
            </tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `;
    }).join('');

    wrap.innerHTML = banner + tBlocks;
    wrap.classList.remove('hidden');
  }

  /* ================================================================
     Helpers
  ================================================================ */
  function pct(wins, total) {
    if (!total) return '—';
    return (wins / total * 100).toFixed(1) + '%';
  }

  function badge(p) {
    const cls = p === 1 ? 'b1' : p === 2 ? 'b2' : p === 3 ? 'b3' : p === 4 ? 'b4' : 'bx';
    return `<span class="badge ${cls}">#${p}</span>`;
  }

  function esc(str) {
    if (str == null) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /* ================================================================
     Init
  ================================================================ */
  boot();
</script>
</body>
</html>
